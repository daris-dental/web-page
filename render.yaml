services:
  - type: web
    name: daris-dental
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn settings.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: daris-dental-db
          property: connectionString
      - key: SENDGRID_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: ADMIN_EMAIL
        sync: false

databases:
  - name: daris-dental-db
    plan: free