{% extends 'panel/_base_panel.html' %}
{% block title %}Confirmar eliminación{% endblock %}

{% block panel_content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card card-soft shadow-sm border-danger">
      <div class="card-body p-4 text-center">
        <i class="bi bi-exclamation-triangle display-4 text-danger"></i>
        <h1 class="h5 mt-3">¿Eliminar {{ titulo }}?</h1>
        <p class="text-muted small mb-4">
          «{{ objeto }}» se eliminará de forma permanente.
        </p>
        <form method="post" class="d-flex justify-content-center gap-2">
          {% csrf_token %}
          <button class="btn btn-danger">
            <i class="bi bi-trash"></i> Sí, eliminar
          </button>
          <a href="{% url cancelar_url %}" class="btn btn-outline-secondary">
            Cancelar
          </a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
