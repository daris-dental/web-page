<!DOCTYPE html>
<html lang="es">
<body style="font-family: Arial, sans-serif; background:#f1f5f9; padding:20px;">
  <div style="max-width:520px; margin:0 auto; background:#fff; border-radius:12px; padding:32px;">
    <h2 style="color:#0077b6;">Dari's Dental</h2>
    <p>Hola {{ user.get_full_name|default:user.username }},</p>
    <p>Recibimos una solicitud para restablecer la contraseña de su cuenta.</p>
    <p style="text-align:center; margin:32px 0;">
      <a href="{{ protocol }}://{{ domain }}{% url 'accounts:password_reset_confirm' uidb64=uid token=token %}"
         style="background:#0077b6; color:#fff; padding:14px 24px; border-radius:8px; text-decoration:none;">
        Restablecer contraseña
      </a>
    </p>
    <p style="font-size:13px; color:#64748b;">
      Si usted no solicitó este cambio, ignore este correo.
    </p>
  </div>
</body>
</html>
