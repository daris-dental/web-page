{% extends 'base.html' %}
{% block title %}Enlace inválido{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 text-center">
    <div class="card card-soft shadow-sm">
      <div class="card-body p-4 p-md-5">
        <i class="bi bi-x-octagon display-4 text-danger"></i>
        <h1 class="h5 mt-3">Enlace inválido o expirado</h1>
        <p class="text-muted">Regístrese de nuevo.</p>
        <a href="{% url 'accounts:registro' %}" class="btn btn-primary mt-3">Registrarse</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
