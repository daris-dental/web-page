{% extends 'base.html' %}
{% block title %}Correo enviado{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card card-soft shadow-sm">
      <div class="card-body p-4 p-md-5 text-center">
        <i class="bi bi-check-circle display-4 text-success"></i>
        <h1 class="h4 mt-3">Revise su correo</h1>
        <p class="text-muted small mb-0">
          Si existe una cuenta con ese correo, recibirá un enlace
          para restablecer la contraseña en unos minutos.
        </p>
        <a href="{% url 'accounts:login' %}" class="btn btn-outline-primary mt-4">
          Volver al inicio de sesión
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
