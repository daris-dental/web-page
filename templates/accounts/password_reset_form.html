{% extends 'base.html' %}
{% block title %}Recuperar contraseña{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card card-soft shadow-sm">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <i class="bi bi-envelope-lock display-5 text-primary"></i>
          <h1 class="h4 mt-2 mb-1">Recuperar contraseña</h1>
          <p class="text-muted small mb-0">
            Le enviaremos un enlace para restablecerla.
          </p>
        </div>
        <form method="post" novalidate>
          {% csrf_token %}
          {% include '_form_fields.html' %}
          <button class="btn btn-primary w-100 py-2">
            <i class="bi bi-send"></i> Enviar enlace
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
