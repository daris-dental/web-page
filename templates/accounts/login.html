{% extends 'base.html' %}
{% block title %}Iniciar sesión · Dari's Dental{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card card-soft shadow-sm">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <i class="bi bi-shield-lock display-5 text-primary"></i>
          <h1 class="h3 mt-2 mb-1">Iniciar sesión</h1>
          <p class="text-muted small mb-0">Acceda con usuario o correo</p>
        </div>

        <form method="post" novalidate>
          {% csrf_token %}
          {% include '_form_fields.html' %}
          <button type="submit" class="btn btn-primary w-100 py-2 mt-2">
            <i class="bi bi-box-arrow-in-right"></i> Entrar
          </button>
        </form>

        <hr class="my-4">
        <p class="text-center small text-muted mb-0">
          ¿No tiene cuenta?
          <a href="{% url 'accounts:registro' %}" class="text-decoration-none fw-semibold">Regístrese</a>
        </p>
        <p class="text-center small mt-3 mb-0">
  <a href="{% url 'accounts:password_reset' %}" class="text-decoration-none">
    ¿Olvidó su contraseña?
  </a>
</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
